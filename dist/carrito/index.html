<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito · Mindtrix</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/mindtrix.css">
</head>
<body class="mindtrix">
<header class="mx-header">
  <div class="mx-wrap mx-top"><a class="mx-brand" href="/"><span aria-hidden="true">✳</span>mindtrix</a></div>
</header>
<main class="mx-wrap mx-rubros" id="carrito">
  <h1>Tu carrito</h1>
  <ul id="carrito-productos"></ul>
  <p id="carrito-total"></p>
  <p id="carrito-entrega" hidden>
    <label for="carrito-correo">Correo para recibir las guías</label><br>
    <input id="carrito-correo" type="email" autocomplete="email" maxlength="254" required>
  </p>
  <button type="button" class="button" id="carrito-pagar" disabled>Probar pago con Mercado Pago</button>
  <p id="carrito-estado" role="status"></p>
  <a class="mx-collection" href="/taller-curioso/">Ver guías</a>
  <noscript><p>Activá JavaScript para usar el carrito.</p></noscript>
</main>
</body>
</html>
