<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito · Mindtrix</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/mindtrix.css">
  <script defer src="/cuenta.js"></script>
</head>
<body class="mindtrix">
<header class="mx-header">
  <div class="mx-wrap mx-top"><a class="mx-brand" href="/"><span aria-hidden="true">✳</span>mindtrix</a></div>
</header>
<main class="mx-wrap mx-rubros" id="carrito">
  <h1>Tu carrito</h1>
  <ul id="carrito-productos"></ul>
  <p id="carrito-total"></p>
  <div id="carrito-cuenta" hidden>
    <p data-cuenta-carrito>Podés iniciar sesión para guardar la compra en tu cuenta o pagar como invitado.</p>
    <a class="mx-collection" href="/auth/google?volver=carrito">Continuar con Google</a>
  </div>
  <button type="button" class="button" id="carrito-pagar" disabled>Pagar con Mercado Pago</button>
  <p id="carrito-estado" role="status"></p>
  <section id="carrito-descargas" aria-labelledby="titulo-descargas" hidden>
    <h2 id="titulo-descargas">Tus descargas</h2>
    <ul id="carrito-enlaces"></ul>
    <p>Conservá estos enlaces. Podés usarlos durante 2 días desde la confirmación en Mindtrix.</p>
  </section>
  <a class="mx-collection" href="/taller-curioso/">Ver guías</a>
  <noscript><p>Activá JavaScript para usar el carrito.</p></noscript>
</main>
</body>
</html>
